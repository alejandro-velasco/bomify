[package]
name = "bomify-plugin-huggingface"
version = "0.1.0"
edition = "2024"
description = "bomify plugin for Hugging Face Hub models, on Hugging Face's own hf-hub client"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hf-hub = { version = "1.0.0", features = ["blocking"] }
packageurl = "0.7"
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha1 = "0.11"
sha2 = "0.11"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
