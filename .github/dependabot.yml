version: 2
updates:
  # bomify and each of its Go plugins (plugins/bomify-plugin-*/, each its
  # own module; see plugins/README.md#plugin-languages), grouped into one
  # update.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/plugins/*"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

