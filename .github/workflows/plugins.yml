name: Plugins

# Builds every first-party plugin for every platform bomify releases (the
# Makefile's RELEASE_PLATFORMS), each plugin in a job of its own, uploading
# the binaries laid out as hack/pluginpackages' -prebuilt reads them,
# whatever the plugin's language:
#
#   <kind>/<os>-<arch>/bomify-plugin-<kind>[.exe]
#
#   list   finds the plugins by the manifest naming their language (see
#          plugins/README.md#plugin-languages), so a new one is built
#          without changing this file.
#   go     one job per Go plugin, cross-compiling it for every platform
#          (make prebuilt-go-plugins), into a plugins-go-<kind> artifact.
#   rust   one job per Rust plugin and platform, on that platform's own
#          runner, since Rust's TLS stack compiles C, which wants the
#          platform's own toolchain (make prebuilt-rust-plugins), into a
#          plugins-rust-<kind>-<os>-<arch> artifact. Every platform only
#          when all-platforms is set, or anything Rust-related changed
#          (see list); otherwise only linux/amd64, which the container
#          image takes, since nothing else could have broken the others.
#
# Binaries are static, as the container image needs (see
# hack/build-<lang>-plugins.sh).
#
# Build calls it to check every plugin still builds everywhere; Release,
# to package exactly what it builds, so the job that signs compiles none
# of the plugins.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build; the calling run's own if empty.
        type: string
        default: ""
      all-platforms:
        description: Build the Rust plugins for every platform, whatever changed.
        type: boolean
        default: false

permissions: {}

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.list.outputs.go }}
      rust: ${{ steps.list.outputs.rust }}
      rust-platforms: ${{ steps.platforms.outputs.rust }}
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      # Each a JSON array of plugin kinds, e.g. ["generic","helm"].
      - name: List plugins by language
        id: list
        run: |
          kinds() {
            for manifest in plugins/bomify-plugin-*/"$1"; do
              if [ -e "$manifest" ]; then
                dir=$(dirname "$manifest")
                basename "$dir" | sed 's/^bomify-plugin-//'
              fi
            done | jq -R . | jq -cs .
          }
          echo "go=$(kinds go.mod)" >> "$GITHUB_OUTPUT"
          echo "rust=$(kinds Cargo.toml)" >> "$GITHUB_OUTPUT"

      # A JSON array of the platforms to build the Rust plugins for: every
      # one if all-platforms is set, or anything that could break one
      # changed since the base (a pull request's base, or the commit a
      # push came after) — a Rust plugin's files, its build script, or
      # this workflow — or the base can't be found (a branch's first
      # push); otherwise only linux/amd64, which the container image takes.
      - name: Choose the Rust platforms
        id: platforms
        env:
          ALL_PLATFORMS: ${{ inputs.all-platforms }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          every='[
            {"os": "linux", "arch": "amd64", "runner": "ubuntu-latest"},
            {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm"},
            {"os": "darwin", "arch": "amd64", "runner": "macos-latest"},
            {"os": "darwin", "arch": "arm64", "runner": "macos-latest"},
            {"os": "windows", "arch": "amd64", "runner": "windows-latest"}
          ]'
          base=""
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
          esac

          all=false
          if [ "$ALL_PLATFORMS" = true ]; then
            all=true
            echo "every platform: asked for"
          elif [ -z "$base" ] || [ -z "${base//0/}" ] || ! git fetch -q --no-tags --depth=1 origin "$base"; then
            all=true
            echo "every platform: no base to compare with"
          else
            watched="hack/build-rust-plugins.sh .github/workflows/plugins.yml"
            for manifest in plugins/bomify-plugin-*/Cargo.toml; do
              if [ -e "$manifest" ]; then
                watched="$watched $(dirname "$manifest")"
              fi
            done
            changed=$(git diff --name-only "$base" HEAD -- $watched)
            if [ -n "$changed" ]; then
              all=true
              echo "every platform: changed since $base:"
              echo "$changed"
            else
              echo "linux/amd64 only: nothing Rust-related changed since $base"
            fi
          fi

          if [ "$all" = true ]; then
            echo "rust=$(echo "$every" | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "rust=$(echo "$every" | jq -c '[.[] | select(.os == "linux" and .arch == "amd64")]')" >> "$GITHUB_OUTPUT"
          fi

  go:
    needs: list
    if: needs.list.outputs.go != '[]'
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.list.outputs.go) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make prebuilt-go-plugins GO_PLUGINS=plugins/bomify-plugin-${{ matrix.kind }} PREBUILT_PLUGINS_DIR=prebuilt

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugins-go-${{ matrix.kind }}
          path: prebuilt/
          if-no-files-found: error

  rust:
    needs: list
    if: needs.list.outputs.rust != '[]'
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.list.outputs.rust) }}
        platform: ${{ fromJSON(needs.list.outputs.rust-platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Install musl
        if: matrix.platform.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # The script rather than make, which the Windows runner may lack.
      - name: Build
        env:
          OUT_DIR: prebuilt
          PLATFORMS: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          PLUGINS: plugins/bomify-plugin-${{ matrix.kind }}
        run: hack/build-rust-plugins.sh

      # Every build answers "contract", where it can run: hack/pluginpackages
      # asks the linux/amd64 one for the package's contract versions.
      - name: Check it runs
        if: matrix.platform.os != 'darwin' || matrix.platform.arch == 'arm64'
        run: prebuilt/*/${{ matrix.platform.os }}-${{ matrix.platform.arch }}/* contract

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugins-rust-${{ matrix.kind }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: prebuilt/
          if-no-files-found: error
