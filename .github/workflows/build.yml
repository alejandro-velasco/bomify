name: Build

on:
  push:
    branches:
    - main
    - feature/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: make test

  build-container:
    runs-on: ubuntu-latest
    env:
      CONTAINER_TOOL: podman
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build container
        run: make build-container

# Releasing happens in release.yml, once this workflow passes on main.
