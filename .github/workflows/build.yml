name: Build

on:
  push:
    branches:
    - main
    - feature/**
  pull_request:

jobs:
  semantic-release-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preview next release
        id: semantic-release
        run: |
          npx --yes \
            --package=semantic-release \
            --package=@semantic-release/commit-analyzer \
            --package=@semantic-release/release-notes-generator \
            --package=@semantic-release/changelog \
            --package=@semantic-release/exec \
            semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: semantic-release-preview
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          NEXT_VERSION: ${{ needs.semantic-release-preview.outputs.version }}
        run: |
          if [ -n "$NEXT_VERSION" ]; then
            make build VERSION="$NEXT_VERSION"
          else
            make build
          fi

      - name: Test
        run: make test

  build-container:
    runs-on: ubuntu-latest
    env:
      CONTAINER_TOOL: podman
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build container
        run: make build-container

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      CONTAINER_TOOL: podman
      CONTAINER_REGISTRY: ghcr.io
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute container repo
        id: repo
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Release
        env:
          CONTAINER_REPO: ${{ steps.repo.outputs.repo }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            --package=semantic-release \
            --package=@semantic-release/commit-analyzer \
            --package=@semantic-release/release-notes-generator \
            --package=@semantic-release/changelog \
            --package=@semantic-release/exec \
            --package=@semantic-release/github \
            semantic-release
