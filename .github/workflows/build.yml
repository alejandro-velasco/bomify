name: Build

on:
  push:
    branches:
    - main
    - alpha-release
    - beta-release
    - feature/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: make test

  build-container:
    runs-on: ubuntu-latest
    env:
      CONTAINER_TOOL: podman
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build container
        run: make build-container

# Releasing happens in release.yml, once this workflow passes on a release
# branch.
