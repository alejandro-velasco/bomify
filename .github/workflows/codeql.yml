name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      # Covers bomify itself and every plugin under plugins/. Most share
      # this repo's one go.mod, reached by a single build; bomify-plugin-grype
      # is its own Go module (see the Makefile's "plugins" target for why),
      # but CodeQL's Go autobuilder scans the whole checkout for go.mod
      # files and builds each one it finds, so it's still covered.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"
          output: sarif-results
