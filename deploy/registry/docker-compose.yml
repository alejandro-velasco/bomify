# Local test registry for bomify. Certs are generated on the host by
# generate-certs.sh (see the Makefile — `make up` runs it before starting
# this), not by a container here. See README.md.

services:
  registry:
    image: registry:3
    container_name: ${NAME:-bomify-test-registry}
    pull_policy: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
    volumes:
      - ./certs:/certs:ro
      - ./data:/var/lib/registry
