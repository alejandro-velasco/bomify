[project]
site_url = "https://alejandro-velasco.github.io/bomify/"
site_name = "bomify"
site_description = "bomify builds packages from CycloneDX Software Bills of Materials (SBOMs)."
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/alejandro-velasco/bomify"
repo_name = "alejandro-velasco/bomify"
edit_uri = "edit/main/docsite/docs/"

nav = [
  { "Getting started" = [
      "getting-started/index.md",
      "getting-started/installation.md",
      "getting-started/installing-plugins.md",
      "getting-started/quickstart.md",
  ] },
  { "Usage" = [
      "usage/index.md",
      { "bomify" = "usage/reference/bomify.md" },
      { "bomify build" = "usage/reference/bomify_build.md" },
      { "bomify distribute" = "usage/reference/bomify_distribute.md" },
      { "bomify distribution" = [
          { "bomify distribution" = "usage/reference/bomify_distribution.md" },
          { "bomify distribution create" = "usage/reference/bomify_distribution_create.md" },
          { "bomify distribution list" = "usage/reference/bomify_distribution_list.md" },
          { "bomify distribution remove" = "usage/reference/bomify_distribution_remove.md" },
      ] },
      { "bomify login" = "usage/reference/bomify_login.md" },
      { "bomify logout" = "usage/reference/bomify_logout.md" },
      { "bomify pull" = "usage/reference/bomify_pull.md" },
      { "bomify push" = "usage/reference/bomify_push.md" },
      { "bomify sbom" = [
          { "bomify sbom" = "usage/reference/bomify_sbom.md" },
          { "bomify sbom generate" = "usage/reference/bomify_sbom_generate.md" },
      ] },
      { "bomify security" = [
          { "bomify security" = "usage/reference/bomify_security.md" },
          { "bomify security scan" = "usage/reference/bomify_security_scan.md" },
      ] },
      { "bomify tag" = "usage/reference/bomify_tag.md" },
      { "bomify save" = "usage/reference/bomify_save.md" },
      { "bomify load" = "usage/reference/bomify_load.md" },
      { "bomify rmp" = "usage/reference/bomify_rmp.md" },
      { "bomify packages" = [
          { "bomify packages" = "usage/reference/bomify_packages.md" },
          { "bomify package" = "usage/reference/bomify_package.md" },
          { "bomify package build" = "usage/reference/bomify_package_build.md" },
          { "bomify package distribute" = "usage/reference/bomify_package_distribute.md" },
          { "bomify package load" = "usage/reference/bomify_package_load.md" },
          { "bomify package manifest" = "usage/reference/bomify_package_manifest.md" },
          { "bomify package prune" = "usage/reference/bomify_package_prune.md" },
          { "bomify package pull" = "usage/reference/bomify_package_pull.md" },
          { "bomify package push" = "usage/reference/bomify_package_push.md" },
          { "bomify package remove" = "usage/reference/bomify_package_remove.md" },
          { "bomify package save" = "usage/reference/bomify_package_save.md" },
          { "bomify package tag" = "usage/reference/bomify_package_tag.md" },
      ] },
      { "bomify completion" = [
          { "bomify completion" = "usage/reference/bomify_completion.md" },
          { "bomify completion bash" = "usage/reference/bomify_completion_bash.md" },
          { "bomify completion fish" = "usage/reference/bomify_completion_fish.md" },
          { "bomify completion powershell" = "usage/reference/bomify_completion_powershell.md" },
          { "bomify completion zsh" = "usage/reference/bomify_completion_zsh.md" },
