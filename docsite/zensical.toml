  { "Development" = [
      "development/index.md",
      { "Building a plugin" = "development/building-a-plugin.md" },
      { "Component plugin contract" = "development/component-contract.md" },
      { "SBOM generation contract" = "development/sbom-contract.md" },
      { "Security scanning contract" = "development/security-contract.md" },
  ] },
